version: '3'

tasks:
  setup:
    desc: Install dependencies
    cmds:
      - npm ci

  dev:
    desc: Start dev server
    cmds:
      - npm run dev

  build:
    desc: Build frontend bundle
    cmds:
      - npm run build

  serve:dist:
    desc: Build and serve dist
    cmds:
      - npm run serve:dist

  check:
    desc: Typecheck + tests + e2e + build
    cmds:
      - npm run check

  assets:preview:
    desc: Capture OG preview screenshot (1200x630) and convert to static/preview.webp
    cmds:
      - mkdir -p static
      - |
        sh -c '
        npm run dev -- --host 127.0.0.1 --port=5173 --strictPort >/tmp/vayomer-preview-server.log 2>&1 &
        SERVER_PID=$!
        trap "kill $SERVER_PID" EXIT INT TERM
        sleep 2
        npx playwright screenshot --viewport-size=1200,630 http://127.0.0.1:5173/preview static/preview.png
        (cd static && cwebp -q 100 preview.png -o preview.webp)
        '
