version: '3'

tasks:
  setup:
    desc: Install dependencies
    cmds:
      - bun install

  dev:
    desc: Start dev server
    cmds:
      - bun run dev

  build:
    desc: Build frontend bundle
    cmds:
      - bun run build

  serve:dist:
    desc: Build and serve dist
    cmds:
      - bun run serve:dist

  check:
    desc: Typecheck + tests + e2e + build
    cmds:
      - bun run check
